name: open-ledger

on:
  pull_request:
    paths:
      - "projects/open-ledger/**"
      - ".github/workflows/open-ledger.yml"
  push:
    branches:
      - main
    paths:
      - "projects/open-ledger/**"
      - ".github/workflows/open-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-ledger:
    name: open-ledger typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/open-ledger
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: projects/open-ledger/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (wrangler dry-run + inline bundle)
        run: npm run build:inline
      - name: Smoke (wrangler dev + publisher + HTTP checks)
        run: npm run smoke
      - name: Publisher smoke test
        run: |
          node publisher/bin.mjs demo --dry-run --anchor 2026-10-09 >/dev/null
          node publisher/bin.mjs init --out /tmp/publisher.config.json
