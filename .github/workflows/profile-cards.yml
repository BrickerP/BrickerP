name: profile-cards

on:
  pull_request:
    paths:
      - "projects/profile-cards/**"
      - ".github/workflows/profile-cards.yml"
  push:
    branches:
      - main
    paths:
      - "projects/profile-cards/**"
      - ".github/workflows/profile-cards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-cards:
    name: profile-cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/profile-cards
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: projects/profile-cards/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (dry-run deploy)
        run: npm run build
