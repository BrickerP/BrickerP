name: ledger-mcp

on:
  pull_request:
    paths:
      - "projects/ledger-mcp/**"
      - ".github/workflows/ledger-mcp.yml"
  push:
    branches:
      - main
    paths:
      - "projects/ledger-mcp/**"
      - ".github/workflows/ledger-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/ledger-mcp

jobs:
  check:
    name: typecheck-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: projects/ledger-mcp/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (dry-run deploy)
        run: npx wrangler deploy --dry-run --outdir=dist
