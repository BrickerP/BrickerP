name: ledger-mcp

on:
  pull_request:
    paths:
      - "projects/ledger-mcp/**"
      - ".github/workflows/ledger-mcp.yml"
  push:
    branches:
      - main
    paths:
      - "projects/ledger-mcp/**"
      - ".github/workflows/ledger-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/ledger-mcp

jobs:
  check:
    name: typecheck-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: projects/ledger-mcp/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (dry-run deploy)
        run: npx wrangler deploy --dry-run --outdir=dist
