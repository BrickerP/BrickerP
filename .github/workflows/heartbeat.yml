name: Heartbeat

on:
  pull_request:
    paths:
      - "projects/heartbeat/**"
      - ".github/workflows/heartbeat.yml"
  push:
    branches:
      - main
    paths:
      - "projects/heartbeat/**"
      - ".github/workflows/heartbeat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    name: heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/heartbeat
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: projects/heartbeat/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Worker tests
        run: npm test
      - name: Python client tests
        run: python3 -m unittest discover -s clients/python -p 'test_*.py' -v
      - name: Shell client syntax
        run: bash -n clients/shell/hb
