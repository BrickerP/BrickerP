      <text data-role="memory-history-label" x="610" y="568" fill="#111111" font-size="58">D71F9F3 /</text>
      <text data-role="memory-history-label" x="610" y="641" fill="#111111" font-size="54">VISUAL PORTALS</text>
    </g>
  </g>
  <path data-role="stitches" d="M584 275l8 425M596 274l8 425M51 484l1097-10" fill="none" stroke="#1457FF" stroke-width="5" stroke-dasharray="3 15"/>
  <path d="M332 734l818-8 1 124-822 7Z" fill="#111111"/>
  <path d="M337 725l810-8" stroke="#FF4B35" stroke-width="12"/>
  <text data-role="memory-cta" x="350" y="826" fill="#F4F0E3" font-family="Arial Black, Arial, sans-serif" font-size="60" font-weight="900" letter-spacing="-1">ENTER THE HISTORY ↗</text>
  <rect width="1200" height="900" fill="url(#memory-grain)"/>
</svg>
