      <text data-role="memory-history-label" x="98" y="572" fill="#111111" font-size="58">B130094 /</text>
      <text data-role="memory-history-label" x="98" y="645" fill="#111111" font-size="54">HUMAN ZINE</text>
    </g>
    <g transform="rotate(-1 874 586)">
